<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="smartersGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2" />

  <!-- Glowing Play & Screen Outline -->
  <path d="M38 18 H48 C51.3 18 54 20.7 54 24 V40 C54 43.3 51.3 46 48 46 H38" 
        fill="none" 
        stroke="url(#smartersGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- Play Arrow Mark -->
  <polygon points="36,26 47,32 36,38" fill="url(#smartersGrad)" filter="url(#glow)" />

  <!-- Modern Stylized 'S' Ribbon -->
  <path d="M28 20 C20 19 14 23 14 29 C14 36 26 35 26 41 C26 45 20 46 15 44" 
        fill="none" 
        stroke="url(#smartersGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
